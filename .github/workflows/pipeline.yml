name: Temperature Converter CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Continuous Integration (Test Stage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: python -m pytest -v

  build-and-push:
    name: Build & Push Artifact Stage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.deva0710 }}
          password: ${{ secrets.dckr_pat_11qGOvGjpuOYLm7xOu61d8Q1GGs }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.deva0710 }}/temperature-converter:${{ github.sha }}
            ${{ secrets.deva0710 }}/temperature-converter:latest
